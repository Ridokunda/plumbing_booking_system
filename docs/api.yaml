openapi: 3.1.0
info:
  title: WeFixIt HTTP API
  version: 1.0.0
  description: Session-authenticated endpoints used by the server-rendered application.
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wefixit_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Message:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
paths:
  /health/live:
    get:
      summary: Process liveness
      responses:
        '200': { description: Process is running }
  /health/ready:
    get:
      summary: Database readiness
      responses:
        '200': { description: Database is reachable }
        '503': { description: Database is unavailable }
  /login/log:
    post:
      summary: Create a session
      security: [{ csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Authenticated }
        '401': { description: Invalid credentials }
        '429': { description: Too many attempts }
  /booking/book:
    post:
      summary: Create a service request
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201': { description: Booking created }
        '400': { description: Validation failure }
        '403': { description: Customer role required }
  /booking/cancel-booking:
    post:
      summary: Cancel an eligible owned booking
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: Booking cancelled }
        '409': { description: Invalid lifecycle transition }
  /admin/schedule:
    get:
      summary: Legacy administrator schedule listing (preserved)
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
      responses:
        '200': { description: Scheduled bookings }
    post:
      summary: Assign or update a visit with availability and minimum travel-gap validation
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, plumber_id, starts_at, ends_at]
              properties:
                booking_id: { type: integer, minimum: 1 }
                plumber_id: { type: integer, minimum: 1 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                expected_schedule:
                  description: Optional legacy-compatible optimistic check; calendar clients always send the snapshot from dispatch data.
                  type: object
                  required: [status, plumber_id, starts_at, ends_at]
                  properties:
                    status: { type: string }
                    plumber_id: { type: [integer, 'null'] }
                    starts_at: { type: [string, 'null'], format: date-time }
                    ends_at: { type: [string, 'null'], format: date-time }
      responses:
        '200': { description: Job scheduled }
        '400': { description: Invalid input or ineligible plumber }
        '404': { description: Booking not found }
        '409':
          {
            description: Stale snapshot,
            pending reschedule case,
            lifecycle,
            availability,
            or travel-gap conflict,
          }
  /admin/dispatch:
    get:
      summary: Administrator dispatch calendar HTML
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            in: query,
            name: booking_id,
            description: Open a specific booking in the planner,
            schema: { type: integer, minimum: 1 },
          }
      responses:
        '200': { description: Dispatch calendar }
        '403': { description: Administrator access required }
  /admin/dispatch/data:
    get:
      summary: Day/week calendar, availability, and independently paginated work queues
      description: Dates use Africa/Johannesburg. Timestamps are UTC ISO values. The response contains range, timezone, travel_gap_minutes, server_now, plumbers, availability, bookings, unassigned, overdue, and optional selected_booking. Queues contain items, total, page, and pages; page size is 20. Calendar bookings include adjacent travel-buffer neighbours beyond the visible range. Consumers display only visits intersecting that range.
      security: [{ sessionCookie: [] }]
      parameters:
        - {
            in: query,
            name: date,
            schema: { type: string, format: date },
            description: Defaults to today in SAST,
          }
        - { in: query, name: view, schema: { type: string, enum: [day, week], default: day } }
        - {
            in: query,
            name: plumber_id,
            schema: { type: integer, minimum: 1 },
            description: Filters calendar and overdue queue; unassigned requests remain global,
          }
        - { in: query, name: booking_id, schema: { type: integer, minimum: 1 } }
        - { in: query, name: unassigned_page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: overdue_page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: Dispatch data; never cached }
        '400': { description: Invalid date, view, identifier, or page }
        '401': { description: Authentication required; request application/json }
        '403': { description: Administrator access required }
        '404': { description: Selected booking or plumber not found }
  /quotes/{quoteId}/respond:
    post:
      summary: Approve or reject the active quote
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - in: path
          name: quoteId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Quote response recorded }
        '409': { description: Quote is no longer pending }
  /jobs/{bookingId}:
    get:
      summary: View an authorized job record, notes, photos, and completion confirmation
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Job record rendered }
        '404': { description: Job is not visible to this user }
  /jobs/{bookingId}/pdf:
    get:
      summary: Download the authorized job card as a PDF
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Job-card PDF
          content:
            application/pdf: {}
  /support/disputes:
    post:
      summary: Open a dispute for an eligible customer booking
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201': { description: Dispute opened }
  /support/refunds:
    post:
      summary: Request a refund against a paid booking
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201': { description: Refund requested }
        '409': { description: Refund is ineligible or already active }
  /support/reschedules:
    post:
      summary: Propose a new appointment window
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '201': { description: Reschedule requested }
  /payment/checkout:
    post:
      summary: Create a Stripe Checkout session for confirmed work
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '200': { description: Checkout URL returned }
        '409': { description: Work, quote, or confirmation is incomplete }
  /payment/receipt/{bookingId}/pdf:
    get:
      summary: Download a paid booking receipt as a PDF
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Receipt PDF
          content:
            application/pdf: {}
        '404': { description: Paid receipt not found }
